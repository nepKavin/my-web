<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Define exactly one segment representing 1/8th of the wheel's 8-fold symmetry -->
    <g id="spoke_segment" stroke="#FFFFFF" fill="none">
      <!-- Modern minimalist spoke lines -->
      <line x1="100" y1="74" x2="100" y2="54" stroke-width="2" stroke-linecap="round" />
      <line x1="100" y1="42" x2="100" y2="22" stroke-width="2" stroke-linecap="round" />
      
      <!-- Central spoke diamond detail -->
      <polygon points="100,41 104,48 100,55 96,48" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Primary Lotus Petal (Aligned with Spoke, 0 degrees) -->
      <path d="M 100 94 C 107 89, 107 81, 100 78 C 93 81, 93 89, 100 94" stroke-width="1.5" />
      
      <!-- Secondary Inner Lotus Petal (Offset, 22.5 degrees) -->
      <path d="M 100 94 C 104 90, 104 84, 100 82 C 96 84, 96 90, 100 94" stroke-width="1.25" transform="rotate(22.5, 100, 100)" />

      <!-- Ashoka Chakra Outer Rim Details (Arcs on inner rim edge) -->
      <path d="M 97.5 12 A 2.5 2.5 0 0 0 102.5 12" stroke-width="1.5" />
      <path d="M 97.5 12 A 2.5 2.5 0 0 0 102.5 12" stroke-width="1.5" transform="rotate(22.5, 100, 100)" />
    </g>
  </defs>

  <!-- Perfectly Symmetrical Concentric Circles -->
  <g stroke="#FFFFFF" fill="none">
    <!-- Outer Rim Edge -->
    <circle cx="100" cy="100" r="92" stroke-width="2.5" />
    <circle cx="100" cy="100" r="88" stroke-width="1.5" />
    <circle cx="100" cy="100" r="78" stroke-width="2" />

    <!-- Inner Lotus Hub -->
    <circle cx="100" cy="100" r="26" stroke-width="2" />
    <circle cx="100" cy="100" r="22" stroke-width="1.5" />
    <circle cx="100" cy="100" r="6" stroke-width="2" />
    
    <!-- Absolute Sacred Center -->
    <circle cx="100" cy="100" r="2.5" fill="#FFFFFF" stroke="none" />
  </g>

  <!-- Apply the 8 Elegant Spokes to Complete the Wheel -->
  <use href="#spoke_segment" />
  <use href="#spoke_segment" transform="rotate(45, 100, 100)" />
  <use href="#spoke_segment" transform="rotate(90, 100, 100)" />
  <use href="#spoke_segment" transform="rotate(135, 100, 100)" />
  <use href="#spoke_segment" transform="rotate(180, 100, 100)" />
  <use href="#spoke_segment" transform="rotate(225, 100, 100)" />
  <use href="#spoke_segment" transform="rotate(270, 100, 100)" />
  <use href="#spoke_segment" transform="rotate(315, 100, 100)" />
</svg>
